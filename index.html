<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Event Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>QR Event Scanner</h1>

  <div id="reader"></div>

  <div id="result">
    Ready to scan
  </div>

  <script>

    let alreadyScanned = false;

    function onScanSuccess(decodedText) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;

      document.getElementById("result").innerHTML =
        "✅ QR Detected<br><br>" +
        decodedText;

      document.getElementById("result")
        .className = "success";

      console.log("QR:", decodedText);

      setTimeout(function() {

        alreadyScanned = false;

        document.getElementById("result")
          .innerHTML = "Ready to scan";

        document.getElementById("result")
          .className = "";

      }, 2000);
    }


    function onScanFailure(error) {
      // Normal camera scanning failures are ignored.
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true
      },
      false
    );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
