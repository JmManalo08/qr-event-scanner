<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Event Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
    }

    .scanner-id {
      font-size: 16px;
      margin-bottom: 15px;
      color: #555;
    }

    #status {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin: 10px auto;
      max-width: 500px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
      border: 3px solid green;
    }

    .error {
      color: red;
      border: 3px solid red;
    }

    .history-container {
      max-width: 500px;
      margin: 20px auto;
      text-align: left;
    }

    .history-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .stats {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-align: center;
    }

    .scan-item {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      border-left: 6px solid green;
    }

    .scan-item.duplicate {
      border-left-color: orange;
    }

    .scan-item.invalid {
      border-left-color: red;
    }

    .scan-time {
      font-size: 13px;
      color: #777;
    }

    .scan-name {
      font-weight: bold;
      font-size: 17px;
      margin-top: 4px;
    }

    .scan-id {
      font-size: 14px;
      color: #555;
    }

    .scan-result {
      font-weight: bold;
      margin-top: 5px;
    }

  </style>

</head>


<body>

  <h1>📷 QR Event Scanner</h1>

  <div class="scanner-id">
    Scanner: <strong id="scannerIdDisplay">SCANNER-01</strong>
  </div>


  <div id="status">
    📷 Camera is starting...
  </div>


  <div id="reader"></div>


  <div id="result">
    Ready to scan
  </div>


  <div class="history-container">

    <div class="history-title">
      📋 Scan History
    </div>


    <div class="stats">

      Total Scans:
      <strong id="totalScans">0</strong>

      &nbsp; | &nbsp;

      Successful:
      <strong id="successfulScans">0</strong>

      &nbsp; | &nbsp;

      Duplicate:
      <strong id="duplicateScans">0</strong>

    </div>


    <div id="history">

      <div style="text-align:center;color:#777;">
        No scans yet
      </div>

    </div>

  </div>


<script>


// ======================================
// SETTINGS
// ======================================

const API_URL =
"https://script.google.com/macros/s/AKfycbypcSVmjnzEWCLEHcTcFZTF2iZAYD6ReDAQp_pfh9EQDu54fe1TwayyYL4ZBj-17YiMmw/exec";


// Change this for each scanner
const SCANNER_ID = "SCANNER-01";


// ======================================
// VARIABLES
// ======================================

let scanner = null;

let scanning = false;

let totalScans = 0;

let successfulScans = 0;

let duplicateScans = 0;


// ======================================
// CAMERA
// ======================================

async function startCamera() {

  const status =
    document.getElementById("status");


  status.innerHTML =
    "📷 Requesting camera permission...";


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    status.innerHTML =
      "✅ Camera ready";


    stream.getTracks().forEach(
      track => track.stop()
    );


    startScanner();


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "❌ Camera access blocked.<br><br>" +
      "Please allow camera access and reload.";

  }

}


// ======================================
// QR SCANNER
// ======================================

function startScanner() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5QrcodeScanner(

      "reader",

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true

      },

      false

    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );


  scanning = true;

}


// ======================================
// SCAN SUCCESS
// ======================================

async function onScanSuccess(decodedText) {


  if (!scanning) {
    return;
  }


  scanning = false;


  const result =
    document.getElementById("result");


  result.className = "";


  result.innerHTML =
    "🔄 Checking applicant...";


  try {


    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            applicantId:
              decodedText,

            scannerId:
              SCANNER_ID

          })

        }

      );


    const data =
      await response.json();


    // ==================================
    // SUCCESS
    // ==================================

    if (data.success) {


      totalScans++;

      successfulScans++;


      result.className =
        "success";


      result.innerHTML =

        "✅ CHECK-IN SUCCESSFUL" +

        "<br><br>" +

        "👤 " +
        data.fullName +

        "<br>" +

        "🆔 " +
        data.applicantId;


      addHistory(

        data.fullName,

        data.applicantId,

        "CHECKED IN",

        "success"

      );


    }


    // ==================================
    // DUPLICATE
    // ==================================

    else if (data.duplicate) {


      totalScans++;

      duplicateScans++;


      result.className =
        "error";


      result.innerHTML =

        "⚠️ ALREADY CHECKED IN" +

        "<br><br>" +

        "👤 " +
        data.fullName +

        "<br>" +

        "🆔 " +
        data.applicantId;


      addHistory(

        data.fullName,

        data.applicantId,

        "ALREADY CHECKED IN",

        "duplicate"

      );


    }


    // ==================================
    // INVALID
    // ==================================

    else {


      totalScans++;


      result.className =
        "error";


      result.innerHTML =

        "❌ INVALID QR CODE" +

        "<br><br>" +

        decodedText;


      addHistory(

        "Unknown Applicant",

        decodedText,

        "INVALID QR",

        "invalid"

      );

    }


    updateStats();


  }


  catch (error) {


    console.error(error);


    result.className =
      "error";


    result.innerHTML =

      "❌ CONNECTION ERROR" +

      "<br><br>" +

      "Cannot reach the server.";


    // Allow another scan
    setTimeout(function() {

      scanning = true;

    }, 2500);


    return;

  }


  // ==================================
  // READY FOR NEXT SCAN
  // ==================================

  setTimeout(function() {


    scanning = true;


    result.className = "";


    result.innerHTML =
      "Ready to scan";


  }, 2500);

}


// ======================================
// ADD HISTORY
// ======================================

function addHistory(

  fullName,

  applicantId,

  scanResult,

  type

) {


  const history =
    document.getElementById("history");


  // Remove "No scans yet"
  if (
    totalScans === 1
  ) {

    history.innerHTML = "";

  }


  const item =
    document.createElement("div");


  item.className =
    "scan-item " + type;


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );


  item.innerHTML =

    '<div class="scan-time">' +
      time +
    '</div>' +

    '<div class="scan-name">' +
      fullName +
    '</div>' +

    '<div class="scan-id">' +
      "Applicant ID: " +
      applicantId +
    '</div>' +

    '<div class="scan-result">' +
      scanResult +
    '</div>';


  // Put newest scan on top

  history.prepend(item);

}


// ======================================
// UPDATE STATISTICS
// ======================================

function updateStats() {


  document.getElementById(
    "totalScans"
  ).innerText =
    totalScans;


  document.getElementById(
    "successfulScans"
  ).innerText =
    successfulScans;


  document.getElementById(
    "duplicateScans"
  ).innerText =
    duplicateScans;

}


// ======================================
// IGNORE SCAN FAILURES
// ======================================

function onScanFailure(error) {

}


// ======================================
// SHOW SCANNER ID
// ======================================

document.getElementById(
  "scannerIdDisplay"
).innerText =
  SCANNER_ID;


// ======================================
// START CAMERA
// ======================================

window.addEventListener(
  "load",
  startCamera
);


</script>

</body>

</html>
