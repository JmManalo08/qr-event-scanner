<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Event Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin: 15px auto;
      max-width: 500px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>📷 QR Event Scanner</h1>

<div id="status">
  Camera is starting...
</div>

<div id="reader"></div>

<div id="result">
  Ready to scan
</div>


<script>

let scanner = null;
let scanning = false;


// Start camera automatically
async function startCamera() {

  const status = document.getElementById("status");

  status.innerHTML =
    "📷 Requesting camera permission...";

  try {

    // Explicitly request camera permission
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    });

    // Permission granted
    status.innerHTML =
      "✅ Camera permission granted.<br>" +
      "Starting scanner...";

    // Stop the temporary camera stream
    stream.getTracks().forEach(track => track.stop());

    startScanner();

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera access is blocked.<br><br>" +

      "Please allow camera access for this website " +
      "in your browser settings, then reload this page.";

    document.getElementById("result").innerHTML =
      "📷 Camera permission required";

    document.getElementById("result")
      .className = "error";
  }
}


// Start QR scanner
function startScanner() {

  if (scanner) {
    return;
  }

  scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true
    },
    false
  );

  scanner.render(
    onScanSuccess,
    onScanFailure
  );

  scanning = true;
}


// QR detected
function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  document.getElementById("result").innerHTML =
    "✅ QR DETECTED<br><br>" +
    decodedText;

  document.getElementById("result")
    .className = "success";

  console.log("QR:", decodedText);


  setTimeout(function() {

    scanning = true;

    document.getElementById("result")
      .innerHTML = "Ready to scan";

    document.getElementById("result")
      .className = "";

  }, 2000);
}


// Ignore normal scan failures
function onScanFailure(error) {
}


// Automatically start camera
window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
