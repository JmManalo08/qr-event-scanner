<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Event Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 12px;
  text-align: center;
}

h1 {
  margin: 5px 0;
  font-size: 24px;
}

.scanner-id {
  color: #555;
  margin-bottom: 8px;
}

/* ONLINE / OFFLINE */

#connectionStatus {

  max-width: 600px;
  margin: 8px auto;
  padding: 10px;
  border-radius: 10px;
  font-weight: bold;
  background: #168a3a;
  color: white;

}

/* DATABASE BUTTON */

#downloadButton {

  width: 100%;
  max-width: 600px;
  padding: 15px;
  margin: 8px auto;
  border: none;
  border-radius: 12px;
  background: #1976d2;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;

}

#downloadButton:active {
  transform: scale(0.98);
}

/* DATABASE INFO */

#databaseInfo {

  max-width: 600px;
  margin: 8px auto;
  padding: 10px;
  background: white;
  border-radius: 10px;
  font-size: 14px;

}

/* STATUS */

#statusBanner {

  width: 100%;
  max-width: 600px;
  margin: 10px auto;
  padding: 18px 10px;
  border-radius: 14px;
  background: #1976d2;
  color: white;
  font-size: 24px;
  font-weight: bold;

}

.status-ready {
  background: #1976d2 !important;
}

.status-success {
  background: #168a3a !important;
}

.status-duplicate {
  background: #e58a00 !important;
}

.status-invalid {
  background: #d62828 !important;
}

.status-error {
  background: #8b0000 !important;
}

/* CAMERA */

#reader {

  width: 100%;
  max-width: 600px;
  margin: auto;
  background: white;
  border-radius: 14px;
  padding: 8px;

}

/* RESULT */

#result {

  width: 100%;
  max-width: 600px;
  margin: 12px auto;
  padding: 20px;
  background: white;
  border-radius: 14px;
  font-size: 22px;
  font-weight: bold;
  min-height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

}

/* HISTORY */

.history-container {

  width: 100%;
  max-width: 600px;
  margin: 20px auto;
  text-align: left;

}

.history-title {

  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;

}

.stats {

  background: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  margin-bottom: 10px;

}

.scan-item {

  background: white;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  border-left: 7px solid #168a3a;

}

.scan-item.duplicate {
  border-left-color: #e58a00;
}

.scan-item.invalid {
  border-left-color: #d62828;
}

.scan-time {
  font-size: 13px;
  color: #777;
}

.scan-name {
  font-weight: bold;
  font-size: 17px;
  margin-top: 4px;
}

.scan-id {
  font-size: 14px;
  color: #555;
}

.scan-result {
  font-weight: bold;
  margin-top: 5px;
}

@media (max-width: 500px) {

  #statusBanner {
    font-size: 21px;
    padding: 16px 5px;
  }

  #result {
    font-size: 21px;
  }

}

</style>

</head>


<body>


<h1>📷 QR EVENT SCANNER</h1>


<div class="scanner-id">

Scanner:
<strong id="scannerIdDisplay">
SCANNER-01
</strong>

</div>


<div id="connectionStatus">

🟢 ONLINE

</div>


<button id="downloadButton"
       onclick="window.downloadDatabase()"

📥 DOWNLOAD APPLICANT DATABASE

</button>


<div id="databaseInfo">

Database not downloaded yet.

</div>


<div id="statusBanner"
     class="status-ready">

🟢 READY TO SCAN

</div>


<div id="reader"></div>


<div id="result">

Point the camera at a QR code

</div>


<div class="history-container">


<div class="history-title">

📋 SCAN HISTORY

</div>


<div class="stats">

Total:
<strong id="totalScans">0</strong>

&nbsp; | &nbsp;

Successful:
<strong id="successfulScans">0</strong>

&nbsp; | &nbsp;

Duplicate:
<strong id="duplicateScans">0</strong>

</div>


<div id="history">

<div style="text-align:center;color:#777;">

No scans yet

</div>

</div>


</div>


<script>


// =====================================
// SETTINGS
// =====================================

const API_URL =
"https://script.google.com/macros/s/AKfycbypcSVmjnzEWCLEHcTcFZTF2iZAYD6ReDAQp_pfh9EQDu54fe1TwayyYL4ZBj-17YiMmw/exec";


const SCANNER_ID =
"SCANNER-01";


const DATABASE_KEY =
"qr_event_applicants";


// =====================================
// VARIABLES
// =====================================

let scanner = null;

let scanning = false;

let totalScans = 0;

let successfulScans = 0;

let duplicateScans = 0;

let applicants = [];

// =====================================
// OFFLINE SCAN QUEUE
// =====================================

const OFFLINE_QUEUE_KEY = "qr_event_offline_queue";

let offlineQueue = [];


// Load saved offline scans
function loadOfflineQueue() {

  try {

    const saved =
      localStorage.getItem(
        OFFLINE_QUEUE_KEY
      );

    offlineQueue =
      saved ? JSON.parse(saved) : [];

  } catch (error) {

    console.error(
      "Offline queue error:",
      error
    );

    offlineQueue = [];

  }

}


// Save offline scans
function saveOfflineQueue() {

  localStorage.setItem(

    OFFLINE_QUEUE_KEY,

    JSON.stringify(
      offlineQueue
    )

  );

}

// =====================================
// SYNC OFFLINE SCANS
// =====================================

async function syncOfflineScans() {

  if (!navigator.onLine) {
    return;
  }

  if (!offlineQueue || offlineQueue.length === 0) {
    return;
  }

  connectionStatus.innerHTML =
    "🔄 SYNCING OFFLINE SCANS...";

  connectionStatus.style.background =
    "#1976d2";

  const remainingScans = [];

  for (const scan of offlineQueue) {

    try {

      const response = await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            applicantId: scan.applicantId,
            scannerId: scan.scannerId
          })
        }
      );

      const data =
        await response.json();


      if (data.success || data.duplicate) {

        // Successfully handled by Apps Script
        continue;

      }


      // Keep scan if server rejected it
      remainingScans.push(scan);

    }

    catch (error) {

      console.error(
        "Offline sync failed:",
        error
      );

      remainingScans.push(scan);

    }

  }


  offlineQueue =
    remainingScans;

  saveOfflineQueue();


  if (offlineQueue.length === 0) {

    connectionStatus.innerHTML =
      "🟢 ONLINE — ALL SCANS SYNCED";

    connectionStatus.style.background =
      "#168a3a";

  }

  else {

    connectionStatus.innerHTML =
      "🟠 ONLINE — " +
      offlineQueue.length +
      " SCANS PENDING";

    connectionStatus.style.background =
      "#e58a00";

  }

}


// =====================================
// ELEMENTS
// =====================================

const statusBanner =
document.getElementById(
"statusBanner"
);

const result =
document.getElementById(
"result"
);

const connectionStatus =
document.getElementById(
"connectionStatus"
);

const databaseInfo =
document.getElementById(
"databaseInfo"
);


// =====================================
// CONNECTION STATUS
// =====================================

function updateConnectionStatus() {

  if (navigator.onLine) {

    connectionStatus.innerHTML =
    "🟢 ONLINE";

    connectionStatus.style.background =
    "#168a3a";

  } else {

    connectionStatus.innerHTML =
    "📴 OFFLINE";

    connectionStatus.style.background =
    "#d62828";

  }

}


window.addEventListener(
"online",
updateConnectionStatus
);
      
window.addEventListener(
"offline",
updateConnectionStatus
);

updateConnectionStatus();


// =====================================
// LOAD LOCAL DATABASE
// =====================================

function loadLocalDatabase() {

  try {

    const saved =
    localStorage.getItem(
      DATABASE_KEY
    );


    if (saved) {

      applicants =
      JSON.parse(saved);


      databaseInfo.innerHTML =

      "✅ <strong>" +
      applicants.length +
      "</strong> applicants stored on this device.";

      return true;

    }

  }

  catch(error) {

    console.error(error);

  }

  return false;

}


// =====================================
// DOWNLOAD DATABASE
// =====================================

async function downloadDatabase() {


  if (!navigator.onLine) {

    alert(
      "You are currently offline. " +
      "Connect to the internet first."
    );

    return;

  }


  const button =
  document.getElementById(
    "downloadButton"
  );


  button.disabled = true;

  button.innerHTML =
  "⏳ DOWNLOADING...";


  databaseInfo.innerHTML =
  "Connecting to Google Sheets...";


  try {


    const response =
    await fetch(
      API_URL +
      "?api=applicants"
    );


    const data =
    await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Database download failed."
      );

    }


    applicants =
    data.applicants;


    localStorage.setItem(

      DATABASE_KEY,

      JSON.stringify(
        applicants
      )

    );


    databaseInfo.innerHTML =

    "✅ <strong>" +
    applicants.length +
    "</strong> applicants downloaded.<br>" +

    "This device can use this database offline.";


    button.innerHTML =
    "✅ DATABASE UPDATED";


    setTimeout(
      function() {

        button.innerHTML =
        "📥 UPDATE DATABASE";

      },
      2000
    );


  }

  catch(error) {


    console.error(error);


    databaseInfo.innerHTML =

    "❌ Download failed.<br>" +
    error.message;


    button.innerHTML =
    "📥 TRY AGAIN";


  }


  button.disabled = false;

}

window.downloadDatabase = downloadDatabase;


// =====================================
// SHOW STATUS
// =====================================

function showStatus(
type,
text
) {

  statusBanner.className = "";

  statusBanner.classList.add(
    "status-" + type
  );

  statusBanner.innerHTML =
  text;

}


// =====================================
// SOUND
// =====================================

function beep(
frequency = 800,
duration = 150
) {

  try {

    const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

    const audioContext =
    new AudioContext();

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.frequency.value =
    frequency;

    oscillator.type =
    "sine";

    gain.gain.value =
    0.2;

    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      duration
    );

  }

  catch(error) {

    console.log(
      "Audio unavailable"
    );

  }

}


// =====================================
// VIBRATION
// =====================================

function vibrate(
duration
) {

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate(
      duration
    );

  }

}


// =====================================
// START CAMERA
// =====================================

async function startCamera() {


  showStatus(
    "ready",
    "📷 STARTING CAMERA..."
  );


  try {


    const stream =
    await navigator.mediaDevices
    .getUserMedia({

      video: {

        facingMode: {

          ideal:
          "environment"

        }

      },

      audio: false

    });


    stream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );


    showStatus(
      "ready",
      "🟢 READY TO SCAN"
    );


    startScanner();


  }

  catch(error) {


    console.error(error);


    showStatus(
      "error",
      "❌ CAMERA ACCESS BLOCKED"
    );


    result.innerHTML =
    "Please allow camera access.";

  }

}


// =====================================
// START QR SCANNER
// =====================================

function startScanner() {


  if (scanner) {
    return;
  }


  scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      rememberLastUsedCamera:
      true

    },

    false

  );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );


  scanning = true;

}


// =====================================
// FIND LOCAL APPLICANT
// =====================================

function findApplicant(
applicantId
) {

  return applicants.find(

    applicant =>

    String(
      applicant.applicantId
    ).trim()

    ===

    String(
      applicantId
    ).trim()

  );

}


// =====================================
// QR SCANNED
// =====================================

async function onScanSuccess(
decodedText
) {


  if (!scanning) {
    return;
  }


  scanning = false;


  showStatus(
    "ready",
    "🔄 CHECKING..."
  );


  result.innerHTML =
  "Checking applicant...";


  try {


    if (navigator.onLine) {


      const response =
      await fetch(

        API_URL,

        {

          method:
          "POST",

          headers: {

            "Content-Type":
            "text/plain;charset=utf-8"

          },

          body:
          JSON.stringify({

            applicantId:
            decodedText,

            scannerId:
            SCANNER_ID

          })

        }

      );


      const data =
      await response.json();


      processServerResult(
        data,
        decodedText
      );


    }

    else {


      processOfflineScan(
        decodedText
      );

    }


  }

  catch(error) {


    console.error(error);


    if (!navigator.onLine) {

      processOfflineScan(
        decodedText
      );

    }

    else {

      showStatus(
        "error",
        "🔴 CONNECTION ERROR"
      );

      result.innerHTML =
      "Cannot reach server.";

    }

  }


  setTimeout(
    function() {

      scanning = true;

      showStatus(
        "ready",
        "🟢 READY TO SCAN"
      );

      result.innerHTML =
      "Point the camera at a QR code";

    },
    2500
  );

}


// =====================================
// ONLINE RESULT
// =====================================

function processServerResult(
data,
decodedText
) {


  if (data.success) {


    totalScans++;

    successfulScans++;


    showStatus(
      "success",
      "🟢 CHECK-IN SUCCESSFUL"
    );


    result.innerHTML =

    "<div style='font-size:30px;'>✓</div>" +

    "<div>" +
    data.fullName +
    "</div>" +

    "<div style='font-size:18px;margin-top:8px;'>" +
    "Applicant ID: " +
    data.applicantId +
    "</div>" +

    "<div style='margin-top:10px;font-size:17px;'>" +
    "SCAN RECORDED" +
    "</div>";


    beep(
      1000,
      180
    );

    vibrate(250);


    addHistory(
      data.fullName,
      data.applicantId,
      "CHECKED IN",
      "success"
    );

  }


  else if (data.duplicate) {


    totalScans++;

    duplicateScans++;


    showStatus(
      "duplicate",
      "🟠 ALREADY CHECKED IN"
    );


    result.innerHTML =

    "<div style='font-size:30px;'>⚠️</div>" +

    "<div>" +
    data.fullName +
    "</div>" +

    "<div style='font-size:18px;margin-top:8px;'>" +
    "Applicant ID: " +
    data.applicantId +
    "</div>" +

    "<div style='margin-top:10px;font-size:17px;'>" +
    "ALREADY SCANNED" +
    "</div>";


    beep(
      500,
      350
    );

    vibrate(
      [200,100,200]
    );


    addHistory(
      data.fullName,
      data.applicantId,
      "ALREADY CHECKED IN",
      "duplicate"
    );

  }


  else {


    totalScans++;


    showStatus(
      "invalid",
      "🔴 INVALID QR CODE"
    );


    result.innerHTML =

    "<div style='font-size:30px;'>❌</div>" +

    "<div>INVALID QR CODE</div>";


    beep(
      250,
      500
    );

    vibrate(400);


    addHistory(
      "Unknown Applicant",
      decodedText,
      "INVALID QR",
      "invalid"
    );

  }


  updateStats();

}


// =====================================
// OFFLINE SCAN
// =====================================

function processOfflineScan(decodedText) {

  // Make sure the applicant database exists
  if (!applicants || applicants.length === 0) {

    showStatus(
      "error",
      "❌ NO OFFLINE DATABASE"
    );

    result.innerHTML =
      "Download the applicant database first.";

    beep(250, 500);
    vibrate(400);

    return;
  }


  // Find applicant
  const applicant =
    findApplicant(decodedText);


  // Applicant not found
  if (!applicant) {

    totalScans++;

    showStatus(
      "invalid",
      "🔴 INVALID QR CODE"
    );

    result.innerHTML =
      "<div style='font-size:30px;'>❌</div>" +
      "<div>APPLICANT NOT FOUND</div>" +
      "<div style='font-size:16px;margin-top:8px;'>" +
      decodedText +
      "</div>";

    beep(250, 500);
    vibrate(400);

    addHistory(
      "Unknown Applicant",
      decodedText,
      "INVALID QR",
      "invalid"
    );

    updateStats();

    return;
  }


  // Create offline scan
  const offlineScan = {

    scanId:
      Date.now().toString() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10),

    applicantId:
      applicant.applicantId,

    fullName:
      applicant.fullName,

    scannerId:
      SCANNER_ID,

    scanTime:
      new Date().toISOString(),

    offline:
      true

  };


  // Save to offline queue
  offlineQueue.push(
    offlineScan
  );

  saveOfflineQueue();


  // Update statistics
  totalScans++;
  successfulScans++;


  // Show success
  showStatus(
    "success",
    "🟢 OFFLINE CHECK-IN"
  );


  result.innerHTML =
    "<div style='font-size:40px;'>✓</div>" +
    "<div>" +
    applicant.fullName +
    "</div>" +
    "<div style='font-size:18px;margin-top:8px;'>" +
    "Applicant ID: " +
    applicant.applicantId +
    "</div>" +
    "<div style='margin-top:12px;font-size:18px;'>" +
    "💾 SAVED ON THIS DEVICE" +
    "</div>" +
    "<div style='margin-top:6px;font-size:14px;'>" +
    "Pending upload: " +
    offlineQueue.length +
    "</div>";


  beep(1000, 180);
  vibrate(250);


  addHistory(
    applicant.fullName,
    applicant.applicantId,
    "OFFLINE — PENDING SYNC",
    "success"
  );


  updateStats();

}


// =====================================
// HISTORY
// =====================================

function addHistory(

fullName,

applicantId,

scanResult,

type

) {


  const history =
  document.getElementById(
    "history"
  );


  if (
    totalScans === 1
  ) {

    history.innerHTML =
    "";

  }


  const item =
  document.createElement(
    "div"
  );


  item.className =
  "scan-item " +
  type;


  const now =
  new Date();


  const time =
  now.toLocaleTimeString(
    [],
    {

      hour:
      "2-digit",

      minute:
      "2-digit",

      second:
      "2-digit"

    }
  );


  item.innerHTML =

  '<div class="scan-time">' +
  time +
  '</div>' +

  '<div class="scan-name">' +
  fullName +
  '</div>' +

  '<div class="scan-id">' +
  "Applicant ID: " +
  applicantId +
  '</div>' +

  '<div class="scan-result">' +
  scanResult +
  '</div>';


  history.prepend(
    item
  );

}


// =====================================
// STATS
// =====================================

function updateStats() {


  document.getElementById(
    "totalScans"
  ).innerText =
  totalScans;


  document.getElementById(
    "successfulScans"
  ).innerText =
  successfulScans;


  document.getElementById(
    "duplicateScans"
  ).innerText =
  duplicateScans;

}


// =====================================
// SCAN FAILURE
// =====================================

function onScanFailure(
error
) {

}


// =====================================
// SCANNER ID
// =====================================

document.getElementById(
"scannerIdDisplay"
).innerText =
SCANNER_ID;


// =====================================
// LOAD DATABASE
// =====================================

loadLocalDatabase();
      
loadOfflineQueue();




// =====================================
// START CAMERA
// =====================================

window.addEventListener(
"load",
startCamera
);

</script>

</body>

</html>
