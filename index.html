<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Event Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin: 15px auto;
      max-width: 500px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

<h1>📷 QR Event Scanner</h1>

<div id="status">
  Camera is starting...
</div>

<div id="reader"></div>

<div id="result">
  Ready to scan
</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbypcSVmjnzEWCLEHcTcFZTF2iZAYD6ReDAQp_pfh9EQDu54fe1TwayyYL4ZBj-17YiMmw/exec";

const SCANNER_ID = "SCANNER-01";

let scanner = null;
let scanning = false;


// ================================
// START CAMERA
// ================================

async function startCamera() {

  const status = document.getElementById("status");

  status.innerHTML =
    "📷 Requesting camera permission...";

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

    status.innerHTML =
      "✅ Camera ready.<br>Starting scanner...";

    stream.getTracks().forEach(
      track => track.stop()
    );

    startScanner();

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera access is blocked.<br><br>" +
      "Please allow camera access and reload.";

    document.getElementById("result").innerHTML =
      "📷 Camera permission required";

    document.getElementById("result")
      .className = "error";
  }
}


// ================================
// START QR SCANNER
// ================================

function startScanner() {

  if (scanner) {
    return;
  }

  scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true
    },
    false
  );

  scanner.render(
    onScanSuccess,
    onScanFailure
  );

  scanning = true;
}


// ================================
// QR SCANNED
// ================================

async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  const result =
    document.getElementById("result");

  result.className = "";

  result.innerHTML =
    "🔄 Checking applicant...";


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        applicantId: decodedText,

        scannerId: SCANNER_ID

      })

    });


    const data = await response.json();


    // ================================
    // SUCCESS
    // ================================

    if (data.success) {

      result.className = "success";

      result.innerHTML =
        "✅ CHECK-IN SUCCESSFUL" +
        "<br><br>" +
        "👤 " + data.fullName +
        "<br>" +
        "🆔 " + data.applicantId;

    }


    // ================================
    // DUPLICATE
    // ================================

    else if (data.duplicate) {

      result.className = "error";

      result.innerHTML =
        "⚠️ ALREADY CHECKED IN" +
        "<br><br>" +
        "👤 " + data.fullName +
        "<br>" +
        "🆔 " + data.applicantId;

    }


    // ================================
    // INVALID
    // ================================

    else {

      result.className = "error";

      result.innerHTML =
        "❌ " + data.message;

    }

  }


  // ================================
  // CONNECTION ERROR
  // ================================

  catch (error) {

    console.error(error);

    result.className = "error";

    result.innerHTML =
      "❌ CONNECTION ERROR" +
      "<br><br>" +
      "The scanner cannot reach the server.";

  }


  // ================================
  // READY FOR NEXT SCAN
  // ================================

  setTimeout(function() {

    scanning = true;

    result.className = "";

    result.innerHTML =
      "Ready to scan";

  }, 2500);

}


// Ignore normal QR scanning failures

function onScanFailure(error) {
}


// ================================
// AUTOMATICALLY START CAMERA
// ================================

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
