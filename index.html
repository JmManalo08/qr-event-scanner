<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Event Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 12px;
  text-align: center;
}

/* =========================
   HEADER
========================= */

h1 {
  margin: 5px 0;
  font-size: 24px;
}

.scanner-id {
  color: #555;
  margin-bottom: 10px;
}


/* =========================
   LARGE STATUS BANNER
========================= */

#statusBanner {

  width: 100%;
  max-width: 600px;

  margin: 10px auto;

  padding: 18px 10px;

  border-radius: 14px;

  background: #1976d2;

  color: white;

  font-size: 24px;

  font-weight: bold;

  transition: 0.2s;

}


/* READY */

.status-ready {
  background: #1976d2 !important;
}


/* SUCCESS */

.status-success {
  background: #168a3a !important;
}


/* DUPLICATE */

.status-duplicate {
  background: #e58a00 !important;
}


/* INVALID */

.status-invalid {
  background: #d62828 !important;
}


/* ERROR */

.status-error {
  background: #8b0000 !important;
}


/* =========================
   CAMERA
========================= */

#reader {

  width: 100%;

  max-width: 600px;

  margin: auto;

  background: white;

  border-radius: 14px;

  padding: 8px;

}


/* =========================
   LATEST RESULT
========================= */

#result {

  width: 100%;

  max-width: 600px;

  margin: 12px auto;

  padding: 20px;

  background: white;

  border-radius: 14px;

  font-size: 22px;

  font-weight: bold;

  min-height: 100px;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

}


/* =========================
   SCAN HISTORY
========================= */

.history-container {

  width: 100%;

  max-width: 600px;

  margin: 20px auto;

  text-align: left;

}

.history-title {

  text-align: center;

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 10px;

}

.stats {

  background: white;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

  margin-bottom: 10px;

}

.scan-item {

  background: white;

  padding: 12px;

  margin-bottom: 8px;

  border-radius: 10px;

  border-left: 7px solid #168a3a;

}

.scan-item.duplicate {

  border-left-color: #e58a00;

}

.scan-item.invalid {

  border-left-color: #d62828;

}

.scan-time {

  font-size: 13px;

  color: #777;

}

.scan-name {

  font-weight: bold;

  font-size: 17px;

  margin-top: 4px;

}

.scan-id {

  font-size: 14px;

  color: #555;

}

.scan-result {

  font-weight: bold;

  margin-top: 5px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  #statusBanner {

    font-size: 21px;

    padding: 16px 5px;

  }

  #result {

    font-size: 21px;

  }

}

</style>

</head>


<body>


<h1>📷 QR EVENT SCANNER</h1>


<div class="scanner-id">

Scanner:
<strong id="scannerIdDisplay">
SCANNER-01
</strong>

</div>


<!-- LARGE STATUS -->

<div id="statusBanner"
     class="status-ready">

READY TO SCAN

</div>


<!-- CAMERA -->

<div id="reader"></div>


<!-- LATEST RESULT -->

<div id="result">

Point the camera at a QR code

</div>


<!-- HISTORY -->

<div class="history-container">


<div class="history-title">

📋 SCAN HISTORY

</div>


<div class="stats">

Total:
<strong id="totalScans">0</strong>

&nbsp; | &nbsp;

Successful:
<strong id="successfulScans">0</strong>

&nbsp; | &nbsp;

Duplicate:
<strong id="duplicateScans">0</strong>

</div>


<div id="history">

<div style="text-align:center;color:#777;">

No scans yet

</div>

</div>


</div>


<script>


// =====================================
// SETTINGS
// =====================================

const API_URL =
"https://script.google.com/macros/s/AKfycbypcSVmjnzEWCLEHcTcFZTF2iZAYD6ReDAQp_pfh9EQDu54fe1TwayyYL4ZBj-17YiMmw/exec";


const SCANNER_ID =
"SCANNER-01";


// =====================================
// VARIABLES
// =====================================

let scanner = null;

let scanning = false;

let totalScans = 0;

let successfulScans = 0;

let duplicateScans = 0;


// =====================================
// ELEMENTS
// =====================================

const statusBanner =
document.getElementById(
"statusBanner"
);

const result =
document.getElementById(
"result"
);


// =====================================
// SHOW STATUS
// =====================================

function showStatus(
type,
text
) {

  statusBanner.className =
  "";

  statusBanner.classList.add(
    "status-" + type
  );

  statusBanner.innerHTML =
  text;

}


// =====================================
// SOUND
// =====================================

function beep(
frequency = 800,
duration = 150
) {

  try {

    const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

    const audioContext =
    new AudioContext();

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.frequency.value =
    frequency;

    oscillator.type =
    "sine";

    gain.gain.value =
    0.2;

    oscillator.start();

    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      duration
    );

  }

  catch(error) {

    console.log(
      "Audio unavailable"
    );

  }

}


// =====================================
// VIBRATION
// =====================================

function vibrate(
duration = 200
) {

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate(
      duration
    );

  }

}


// =====================================
// START CAMERA
// =====================================

async function startCamera() {


  showStatus(
    "ready",
    "📷 STARTING CAMERA..."
  );


  try {


    const stream =
    await navigator.mediaDevices
    .getUserMedia({

      video: {

        facingMode: {

          ideal:
          "environment"

        }

      },

      audio: false

    });


    stream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );


    showStatus(
      "ready",
      "🟢 READY TO SCAN"
    );


    startScanner();


  }


  catch(error) {


    console.error(
      error
    );


    showStatus(
      "error",
      "❌ CAMERA ACCESS BLOCKED"
    );


    result.innerHTML =

    "Please allow camera access " +
    "and reload the page.";

  }

}


// =====================================
// START QR SCANNER
// =====================================

function startScanner() {


  if (scanner) {

    return;

  }


  scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      rememberLastUsedCamera:
      true

    },

    false

  );


  scanner.render(

    onScanSuccess,

    onScanFailure

  );


  scanning = true;

}


// =====================================
// QR SUCCESS
// =====================================

async function onScanSuccess(
decodedText
) {


  if (!scanning) {

    return;

  }


  scanning = false;


  showStatus(
    "ready",
    "🔄 CHECKING..."
  );


  result.innerHTML =
  "Checking applicant...";


  try {


    const response =
    await fetch(

      API_URL,

      {

        method:
        "POST",

        headers: {

          "Content-Type":
          "text/plain;charset=utf-8"

        },

        body:
        JSON.stringify({

          applicantId:
          decodedText,

          scannerId:
          SCANNER_ID

        })

      }

    );


    const data =
    await response.json();


    // =================================
    // SUCCESS
    // =================================

    if (
      data.success
    ) {


      totalScans++;

      successfulScans++;


      showStatus(

        "success",

        "🟢 CHECK-IN SUCCESSFUL"

      );


      result.innerHTML =

      "<div style='font-size:30px;'>✓</div>" +

      "<div>" +
      data.fullName +
      "</div>" +

      "<div style='font-size:18px;margin-top:8px;'>" +
      "Applicant ID: " +
      data.applicantId +
      "</div>" +

      "<div style='margin-top:10px;font-size:17px;'>" +
      "SCAN RECORDED" +
      "</div>";


      beep(
        1000,
        180
      );


      vibrate(
        250
      );


      addHistory(

        data.fullName,

        data.applicantId,

        "CHECKED IN",

        "success"

      );

    }


    // =================================
    // DUPLICATE
    // =================================

    else if (
      data.duplicate
    ) {


      totalScans++;

      duplicateScans++;


      showStatus(

        "duplicate",

        "🟠 ALREADY CHECKED IN"

      );


      result.innerHTML =

      "<div style='font-size:30px;'>⚠️</div>" +

      "<div>" +
      data.fullName +
      "</div>" +

      "<div style='font-size:18px;margin-top:8px;'>" +
      "Applicant ID: " +
      data.applicantId +
      "</div>" +

      "<div style='margin-top:10px;font-size:17px;'>" +
      "THIS APPLICANT WAS ALREADY SCANNED" +
      "</div>";


      beep(
        500,
        350
      );


      vibrate(
        [200,100,200]
      );


      addHistory(

        data.fullName,

        data.applicantId,

        "ALREADY CHECKED IN",

        "duplicate"

      );

    }


    // =================================
    // INVALID
    // =================================

    else {


      totalScans++;


      showStatus(

        "invalid",

        "🔴 INVALID QR CODE"

      );


      result.innerHTML =

      "<div style='font-size:30px;'>❌</div>" +

      "<div>INVALID QR CODE</div>" +

      "<div style='font-size:16px;margin-top:10px;'>" +
      decodedText +
      "</div>";


      beep(
        250,
        500
      );


      vibrate(
        400
      );


      addHistory(

        "Unknown Applicant",

        decodedText,

        "INVALID QR",

        "invalid"

      );

    }


    updateStats();


  }


  catch(error) {


    console.error(
      error
    );


    showStatus(

      "error",

      "🔴 CONNECTION ERROR"

    );


    result.innerHTML =

    "The scanner cannot reach " +
    "the server.";


    vibrate(
      400
    );


  }


  // =================================
  // RETURN TO CAMERA
  // =================================

  setTimeout(

    function() {


      scanning = true;


      showStatus(

        "ready",

        "🟢 READY TO SCAN"

      );


      result.innerHTML =

      "Point the camera at a QR code";


    },

    2500

  );

}


// =====================================
// HISTORY
// =====================================

function addHistory(

fullName,

applicantId,

scanResult,

type

) {


  const history =
  document.getElementById(
    "history"
  );


  if (
    totalScans === 1
  ) {

    history.innerHTML =
    "";

  }


  const item =
  document.createElement(
    "div"
  );


  item.className =
  "scan-item " +
  type;


  const now =
  new Date();


  const time =
  now.toLocaleTimeString(
    [],
    {

      hour:
      "2-digit",

      minute:
      "2-digit",

      second:
      "2-digit"

    }
  );


  item.innerHTML =

  '<div class="scan-time">' +
  time +
  '</div>' +

  '<div class="scan-name">' +
  fullName +
  '</div>' +

  '<div class="scan-id">' +
  "Applicant ID: " +
  applicantId +
  '</div>' +

  '<div class="scan-result">' +
  scanResult +
  '</div>';


  history.prepend(
    item
  );

}


// =====================================
// STATISTICS
// =====================================

function updateStats() {


  document.getElementById(
    "totalScans"
  ).innerText =
  totalScans;


  document.getElementById(
    "successfulScans"
  ).innerText =
  successfulScans;


  document.getElementById(
    "duplicateScans"
  ).innerText =
  duplicateScans;

}


// =====================================
// IGNORE SCAN FAILURES
// =====================================

function onScanFailure(
error
) {

}


// =====================================
// SCANNER ID
// =====================================

document.getElementById(
  "scannerIdDisplay"
).innerText =
SCANNER_ID;


// =====================================
// START
// =====================================

window.addEventListener(
  "load",
  startCamera
);


</script>

</body>

</html>
